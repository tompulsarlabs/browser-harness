name: Harness privacy and regression checks
on:
  push:
    branches: [safari-adapter, fix/private-usage-analytics]
  pull_request:
    branches: [safari-adapter]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    env:
      BH_TELEMETRY: '0'
      BH_RECORD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --extra mcp --with pytest python -m pytest tests/unit -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv run --python 3.12 python -m unittest discover -s adapters/safari/tests -v
        env:
          PYTHONPATH: adapters/safari
      - run: node --test tests/bridge.test.cjs
        working-directory: adapters/safari
